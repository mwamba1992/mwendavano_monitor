# Mwendavano Monitor: Vue web app + API.
# certbot --nginx -d monitor.mwendavano.com adds the 443 server and the redirect.
limit_req_zone $binary_remote_addr zone=monitor_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name monitor.mwendavano.com;

    root /var/www/monitor-web;
    index index.html;
    server_tokens off;
    client_max_body_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_min_length 1024;

    location = /api/auth/login  { limit_req zone=monitor_auth burst=10 nodelay; include /etc/nginx/monitor-proxy.conf; }
    location = /api/auth/verify { limit_req zone=monitor_auth burst=10 nodelay; include /etc/nginx/monitor-proxy.conf; }
    location /api/ { include /etc/nginx/monitor-proxy.conf; }

    location ~ /\. { deny all; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri $uri/ /index.html; }
}
